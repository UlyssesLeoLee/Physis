# Clippy configuration for GVPE
# 见 `GVPE-DOC-57` §1.2 lint 配置

# 允许的 deny 级别 lint 在 Cargo.toml [workspace.lints] 配置
# 本文件用于细粒度配置（threshold 等）

msrv = "1.75"

# 文档允许的特殊标识符（避免 clippy::doc_markdown 误报）
doc-valid-idents = ["NaN", "Inf", "MVP", "ISA", "FFI", "SIMD", "SI", "PGS", "XPBD", "CCD", "SAP", "SAT", "GJK", "EPA", "PBD", "AABB", "SoA", "AoSoA", "POD", "JIT", "TDD", "GCN", "OMP", "DOD", "HPC", "FMA", "NDA", "CRUD", "API", "ABI", "FIFO", "LIFO", "URI", "URL", "ASCII", "UTF", "PCG", "RNG", "LFSR"]
